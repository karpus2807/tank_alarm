; ESP32 DevKit V1 alarm — W5500 + OLED
[env:alarm-devkit]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  arduino-libraries/Ethernet@^2.0.2
  olikraus/U8g2@^2.35.19
build_flags =
  -I../shared
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
